<!doctype html><meta charset="utf-8"><title>ck</title>
<script src="/node_modules/canvaskit-wasm/bin/canvaskit.js"></script>
<script type="module">
const CK = await CanvasKitInit({locateFile:(f)=>`/node_modules/canvaskit-wasm/bin/${f}`});
const facts = {
  keys: Object.keys(CK).filter(k=>/Font|Typeface|Paragraph/i.test(k)),
  hasRefDefault: !!(CK.FontMgr && CK.FontMgr.RefDefault),
  version: CK.version || null,
};
if (CK.FontMgr && CK.FontMgr.RefDefault) {
  const mgr = CK.FontMgr.RefDefault();
  facts.defaultFamilies = mgr ? mgr.countFamilies() : -1;
  if (mgr && mgr.countFamilies) {
    facts.names = [];
    for (let i=0;i<mgr.countFamilies();i++) facts.names.push(mgr.getFamilyName(i));
  }
}
window.__facts = facts;
window.__ready = true;
</script>
